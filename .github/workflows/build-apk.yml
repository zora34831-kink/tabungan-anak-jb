
name: Build TABUNGAN ANAK JB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Check Android platform
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Gradle wrapper tidak ditemukan."
            echo "Membuat ulang project Android di runner..."

            rm -rf android
            npx cap add android
          fi

      - name: Generate Android assets
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync Android
        run: npx cap sync android

      - name: Verify Gradle wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: gradlew masih belum ditemukan."
            ls -la android
            exit 1
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tabungan-anak-jb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
